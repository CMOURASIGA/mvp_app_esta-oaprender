<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D5C" />
      <stop offset="100%" stop-color="#08323D" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF785A" />
      <stop offset="100%" stop-color="#E3655B" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle railway track / arched station roof arc -->
  <path d="M 64 390 Q 256 340 448 390" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M 64 420 Q 256 370 448 420" stroke="rgba(255,255,255,0.2)" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Sleepers / Ties -->
  <line x1="140" y1="392" x2="140" y2="422" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="380" x2="200" y2="410" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="375" x2="256" y2="405" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" />
  <line x1="312" y1="380" x2="312" y2="410" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" />
  <line x1="372" y1="392" x2="372" y2="422" stroke="rgba(255,255,255,0.2)" stroke-width="6" stroke-linecap="round" />

  <!-- Rising Sun of Knowledge -->
  <circle cx="256" cy="180" r="64" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Open Book forming the Station Arch & Wings -->
  <g filter="url(#softShadow)">
    <!-- Left Page -->
    <path d="M 256 280 C 210 240, 140 238, 100 246 C 94 247, 90 252, 90 258 L 90 324 C 90 331, 95 337, 102 336 C 146 328, 212 330, 256 364 Z" fill="#FFFFFF" />
    <!-- Right Page -->
    <path d="M 256 280 C 302 240, 372 238, 412 246 C 418 247, 422 252, 422 258 L 422 324 C 422 331, 417 337, 410 336 C 366 328, 300 330, 256 364 Z" fill="#F8FAFC" />
  </g>

  <!-- Central Friendly Station / Learning Train Front (Coral Accent) -->
  <g filter="url(#softShadow)">
    <!-- Cabin Base -->
    <rect x="206" y="160" width="100" height="110" rx="20" fill="url(#coralGrad)" />
    <!-- Chimney -->
    <rect x="238" y="125" width="36" height="40" rx="8" fill="#FF785A" />
    <ellipse cx="256" cy="125" rx="24" ry="7" fill="#E3655B" />
    <!-- Warm Smoke puffs forming learning sparkles -->
    <circle cx="256" cy="100" r="10" fill="#FFFFFF" opacity="0.85" />
    <circle cx="270" cy="76" r="14" fill="#FFFFFF" opacity="0.7" />
    <circle cx="295" cy="54" r="18" fill="#FFFFFF" opacity="0.5" />

    <!-- Station Clock / Headlight -->
    <circle cx="256" cy="205" r="28" fill="#FFFFFF" />
    <circle cx="256" cy="205" r="24" fill="#FFFBEB" stroke="#0E4D5C" stroke-width="3" />
    <!-- Clock Hands (pointing to 3:00 / cheerful angle) -->
    <line x1="256" y1="205" x2="256" y2="192" stroke="#0E4D5C" stroke-width="3.5" stroke-linecap="round" />
    <line x1="256" y1="205" x2="268" y2="205" stroke="#F27059" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="256" cy="205" r="3" fill="#0E4D5C" />

    <!-- Cowcatcher / Front Grill (teal striped) -->
    <path d="M 216 260 L 296 260 L 286 285 L 226 285 Z" fill="#0E4D5C" rx="4" />
    <line x1="236" y1="262" x2="238" y2="283" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="262" x2="256" y2="283" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="276" y1="262" x2="274" y2="283" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Wordmark Accent Star -->
  <polygon points="256,335 261,348 275,348 263,357 268,370 256,361 244,370 249,357 237,348 251,348" fill="#F59E0B" />
</svg>
